<svg xmlns="http://www.w3.org/2000/svg" width="640" height="540" viewBox="0 0 640 540" role="img" aria-labelledby="title desc">
<title id="title">Tonto — Rim Frame</title>
<desc id="desc">A picture frame whose landscape is the Mogollon Rim: a flat-topped escarpment crowned by ponderosa pines, a saguaro on the desert floor below and a sun in the sky, set above the shared dark teal horizon.</desc>
